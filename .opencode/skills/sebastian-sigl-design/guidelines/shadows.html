<!-- @dsCard group="Spacing" viewport="700x170" name="Hairlines & elevation" subtitle="Structure is 1px lines; shadows only for popovers & covers" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page)}.m{font:500 11px/1.4 var(--font-mono);letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase}.v{font:12px/1.4 var(--font-mono);color:var(--text-muted)}.sw{display:grid;gap:0}.chip{height:56px;border-radius:3px;border:1px solid rgb(0 0 0 / .06)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px"><div><div style="height:72px;border-radius:4px;background:var(--surface-raised);border:1px solid var(--border-default)"></div><div class="m" style="margin-top:8px">hairline</div></div><div><div style="height:72px;border-radius:4px;background:var(--surface-raised);border:1px solid var(--border-strong)"></div><div class="m" style="margin-top:8px">control</div></div><div><div style="height:72px;border-radius:4px;background:var(--surface-raised);border:1px solid var(--border-ink)"></div><div class="m" style="margin-top:8px">hover / active</div></div><div><div style="height:72px;border-radius:4px;background:var(--surface-raised);box-shadow:var(--shadow-pop)"></div><div class="m" style="margin-top:8px">pop (menus, cover)</div></div></div></body></html>
