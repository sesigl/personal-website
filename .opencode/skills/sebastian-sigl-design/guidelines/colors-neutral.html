<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page)}.m{font:500 11px/1.4 var(--font-mono);letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase}.v{font:12px/1.4 var(--font-mono);color:var(--text-muted)}.sw{display:grid;gap:0}.chip{height:56px;border-radius:3px;border:1px solid rgb(0 0 0 / .06)}</style></head><body><div class="m" style="margin-bottom:10px">stone</div><div style="display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px"><div><div class="chip" style="background:var(--stone-0)"></div><div class="m" style="margin-top:6px">0</div></div><div><div class="chip" style="background:var(--stone-25)"></div><div class="m" style="margin-top:6px">25</div></div><div><div class="chip" style="background:var(--stone-100)"></div><div class="m" style="margin-top:6px">100</div></div><div><div class="chip" style="background:var(--stone-200)"></div><div class="m" style="margin-top:6px">200</div></div><div><div class="chip" style="background:var(--stone-300)"></div><div class="m" style="margin-top:6px">300</div></div><div><div class="chip" style="background:var(--stone-450)"></div><div class="m" style="margin-top:6px">450</div></div><div><div class="chip" style="background:var(--stone-500)"></div><div class="m" style="margin-top:6px">500</div></div><div><div class="chip" style="background:var(--stone-600)"></div><div class="m" style="margin-top:6px">600</div></div><div><div class="chip" style="background:var(--stone-800)"></div><div class="m" style="margin-top:6px">800</div></div><div><div class="chip" style="background:var(--stone-900)"></div><div class="m" style="margin-top:6px">900</div></div><div><div class="chip" style="background:var(--stone-950)"></div><div class="m" style="margin-top:6px">950</div></div></div></body></html>
