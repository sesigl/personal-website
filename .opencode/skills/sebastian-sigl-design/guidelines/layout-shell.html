<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page)}.m{font:500 11px/1.4 var(--font-mono);letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase}.v{font:12px/1.4 var(--font-mono);color:var(--text-muted)}.sw{display:grid;gap:0}.chip{height:56px;border-radius:3px;border:1px solid rgb(0 0 0 / .06)}</style></head><body><div style="border:1px solid var(--border-default);border-radius:4px;overflow:hidden;font:11px var(--font-mono);color:var(--text-faint);text-transform:uppercase"><div style="height:32px;border-bottom:1px solid var(--border-default);display:flex;align-items:center;gap:10px;padding:0 12px"><span style="width:8px;height:8px;background:var(--accent)"></span>sticky header · 60px<span style="margin-left:auto">search ⌘K · theme · subscribe</span></div><div style="padding:16px 12px;border-bottom:1px solid var(--border-default)">hero · 12-col grid</div><div style="display:grid;grid-template-columns:1fr 150px;height:100px"><div style="border-right:1px solid var(--border-default);padding:12px;display:flex;flex-direction:column;gap:8px"><span>content column · filters · index rows</span><span style="height:1px;background:var(--border-default)"></span><span style="height:1px;background:var(--border-default)"></span></div><div style="padding:12px">sidebar 300 · sticky</div></div><div style="height:28px;border-top:1px solid var(--border-default);display:flex;align-items:center;padding:0 12px">footer</div></div><div class="v" style="margin-top:8px">&lt;960px: sidebar stacks below · &lt;768px: links move to bottom tab bar</div></body></html>
