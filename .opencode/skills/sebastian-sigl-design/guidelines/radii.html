<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page)}.m{font:500 11px/1.4 var(--font-mono);letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase}.v{font:12px/1.4 var(--font-mono);color:var(--text-muted)}.sw{display:grid;gap:0}.chip{height:56px;border-radius:3px;border:1px solid rgb(0 0 0 / .06)}</style></head><body><div style="display:flex;gap:20px"><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1.5px solid var(--text-strong);border-radius:var(--radius-xs)"></div><span class="m">xs · 2px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1.5px solid var(--text-strong);border-radius:var(--radius-sm)"></div><span class="m">sm · 3px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1.5px solid var(--text-strong);border-radius:var(--radius-md)"></div><span class="m">md · 4px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1.5px solid var(--text-strong);border-radius:var(--radius-lg)"></div><span class="m">lg · 6px</span></div><div style="display:flex;flex-direction:column;gap:8px;align-items:center"><div style="width:72px;height:56px;border:1.5px solid var(--text-strong);border-radius:var(--radius-full)"></div><span class="m">full · avatars</span></div></div></body></html>
