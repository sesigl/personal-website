<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page)}.m{font:500 11px/1.4 var(--font-mono);letter-spacing:.03em;color:var(--text-faint);text-transform:uppercase}.v{font:12px/1.4 var(--font-mono);color:var(--text-muted)}.sw{display:grid;gap:0}.chip{height:56px;border-radius:3px;border:1px solid rgb(0 0 0 / .06)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px"><div style="background:var(--status-success-bg);color:var(--status-success-fg);border-radius:4px;padding:14px 12px;border:1px solid color-mix(in oklab,currentColor 22%,transparent)"><div style="font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.04em">■ success</div><div class="v" style="color:inherit;opacity:.8;margin-top:10px">--status-success-*</div></div><div style="background:var(--status-info-bg);color:var(--status-info-fg);border-radius:4px;padding:14px 12px;border:1px solid color-mix(in oklab,currentColor 22%,transparent)"><div style="font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.04em">■ info</div><div class="v" style="color:inherit;opacity:.8;margin-top:10px">--status-info-*</div></div><div style="background:var(--status-warning-bg);color:var(--status-warning-fg);border-radius:4px;padding:14px 12px;border:1px solid color-mix(in oklab,currentColor 22%,transparent)"><div style="font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.04em">■ warning</div><div class="v" style="color:inherit;opacity:.8;margin-top:10px">--status-warning-*</div></div><div style="background:var(--status-danger-bg);color:var(--status-danger-fg);border-radius:4px;padding:14px 12px;border:1px solid color-mix(in oklab,currentColor 22%,transparent)"><div style="font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.04em">■ danger</div><div class="v" style="color:inherit;opacity:.8;margin-top:10px">--status-danger-*</div></div><div style="background:var(--status-neutral-bg);color:var(--status-neutral-fg);border-radius:4px;padding:14px 12px;border:1px solid color-mix(in oklab,currentColor 22%,transparent)"><div style="font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.04em">■ neutral</div><div class="v" style="color:inherit;opacity:.8;margin-top:10px">--status-neutral-*</div></div></div></body></html>
