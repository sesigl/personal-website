# Quiz for /blog/search-evolution-ladder-0-measure-before-you-rank
# Format: see .claude/skills/publish-blog-post/SKILL.md
questions:
  - question: Your team wants to add vector search next sprint. Nobody has measured the current search yet. What do you do first?
    options:
      - Add vector search and watch the click rate after release
      - Build a set of judged queries and score the current search
      - Ask users in a survey whether search feels better afterwards
      - Tune the index for speed so the new feature fits the budget
    answer: Build a set of judged queries and score the current search
    explanation: Without a baseline on judged queries, you cannot tell if vector search helps, hurts, or only changes which queries fail.
  - question: A colleague judges the query "golf" and asks which results count as relevant. What is the best answer?
    options:
      - Every product whose title contains the word "golf"
      - The products that users clicked most often for it
      - Write down the intent and persona first, then judge
      - Remove it from the test set, because it has no single answer
    answer: Write down the intent and persona first, then judge
    explanation: Ambiguous queries are common in real traffic. Add context such as intent and persona so the judgment is consistent and close to what real users want.
  - question: Your judges labelled only the products that the current ranker returns. What is the risk?
    options:
      - The scores become too low to compare two rankers
      - A ranker that misses many good products can still look perfect
      - NDCG can no longer be calculated for those queries
      - The judges spend too much time on irrelevant products
    answer: A ranker that misses many good products can still look perfect
    explanation: The ideal ranking must include relevant products the ranker never shows. Otherwise missing results cost nothing in the score.
  - question: A new ranker returns the same good products as before, but moves the best one from position 8 to position 1. What happens to NDCG@10?
    options:
      - It stays the same, because the same products are found
      - It goes up, because good results near the top count more
      - It goes down, because the order changed
      - It cannot change unless new products appear
    answer: It goes up, because good results near the top count more
    explanation: NDCG discounts each result by its position. The same product is worth more at the top than further down.
  - question: A change raises the mean NDCG, but many queries with more than three words get clearly worse. What is a good next step?
    options:
      - Ship it, because the mean is what users feel
      - Reject it, because any query that gets worse is a blocker
      - Study the losing queries, adapt the change for them, measure again
      - Remove long queries from the test set, because they are rare
    answer: Study the losing queries, adapt the change for them, measure again
    explanation: An average hides losers. For example, you could apply the change only to short queries. Studying the weak queries often shows a pattern you can fix, and that gives an even better result.
  - question: Users say the right product is somewhere on the page, but rarely the first result. Which metric best tracks this problem?
    options:
      - Recall@50
      - Mean reciprocal rank (MRR)
      - Median response time
      - Number of indexed products
    answer: Mean reciprocal rank (MRR)
    explanation: MRR measures how high the first good result appears. Recall@50 only tells you that good results were found somewhere in the top 50.
  - question: A reranking model improves relevance a little, but doubles p95 response time and the compute bill. How do you decide?
    options:
      - Ship it, because relevance is what users notice first
      - Drop it, because speed always matters more than relevance
      - Weigh relevance, latency and cost together, and look for a cheaper way
      - Check only the median time, because p95 is just outliers
    answer: Weigh relevance, latency and cost together, and look for a cheaper way
    explanation: Search is a trade-off. A better ranking that is too slow or too expensive can lose users and money.
  - question: Why is offline evaluation especially useful when you work with AI coding agents?
    options:
      - It lets the agent skip human relevance judgments completely
      - It gives the agent a repeatable score to test each change against
      - It makes the agent's code changes run faster in production
      - It is the only way an agent can read the search index
    answer: It gives the agent a repeatable score to test each change against
    explanation: A judged test set turns "does this look better?" into a number an agent can optimize, before any change reaches users.
