# Flashcards for /blog/search-evolution-ladder-3-rank-by-text-fit
# Format: see .claude/skills/publish-blog-post/SKILL.md
cards:
  - front: Why change the order and not the candidates in this step?
    back: When only the order changes, you know that a metric gain comes from moving good listings up, not from finding new ones.
  - front: Why does a rare word get more weight in BM25?
    back: A word that appears in only a small part of the catalog tells you much more about what a listing is. A word in almost every listing tells you almost nothing.
  - front: What does the parameter `k1` control?
    back: How fast the reward for repeated mentions flattens out. More mentions still help, but each extra mention adds less.
  - front: What does the parameter `b` control?
    back: How strongly BM25 corrects for listing length. A long text has more chances to contain a query word by accident, so each mention counts less.
  - front: Does BM25 stop keyword stuffing?
    back: No. It limits the reward, because repetition saturates, but a seller who repeats a word still gets a slightly higher score.
  - front: Why must the BM25 statistics use the same analyzer as the query?
    back: "If the query looks up the stem `light` but the index counted the word \"lighting\", the document frequency is wrong and the word gets the wrong weight."
  - front: "Why can BM25 still rank a light blue towel above a ceiling light for \"bathroom lighting\"?"
    back: It counts words, not meaning. After stemming, both listings contain the same words, and a short towel listing can fit them well.
  - front: What is the risk of BM25 statistics in a catalog that changes all the time?
    back: A word that becomes common keeps its old rarity weight until you update the counts. You need a plan for when to recompute them.
  - front: Why divide BM25 by the highest score the query can give?
    back: Raw BM25 has no fixed upper limit, so a recency bonus is worth a lot for one query and almost nothing for another. On a 0-to-1 scale, one weight means the same for every query.
  - front: Does dividing BM25 by the query's maximum score change the order of results for that query?
    back: No. Every listing is divided by the same number. It only changes how text fit compares with other signals such as freshness.
  - front: "With `score = textFit + 0.1 * freshness`, what is the most a brand-new listing can gain over an old one?"
    back: 0.1 of text fit. Freshness decides between listings that fit the query about equally well, but it can't lift a weak match above a good one.
  - front: Why use a half-life for freshness instead of `1 / (1 + ageInDays)`?
    back: With a half-life, every week of age costs the same share, so you can say how many days a better text match is worth. With `1 / (1 + ageInDays)`, the first day costs half and later days almost nothing.
  - front: Does a text fit of 0.76 mean the listing is 76% relevant?
    back: No. The scale is fixed, but the same value can mean a better match for one query than for another. It is a way to compare signals, not a probability.
  - front: Name four things BM25 alone cannot do.
    back: It does not know the product type or which meaning of a word the buyer wants, it ignores word order, and it cannot rank a listing that matching did not let through, for example after a typo.
  - front: Why does it help to put every ranking signal on a 0-to-1 scale before you add boosts?
    back: Then a weight tells you how much a signal can move a listing at most, and you can compare weights directly. A boost with weight 0.1 counts as much as a freshness bonus of 0.1.
