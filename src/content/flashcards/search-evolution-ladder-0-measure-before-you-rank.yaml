# Flashcards for /blog/search-evolution-ladder-0-measure-before-you-rank
# Format: see .claude/skills/publish-blog-post/SKILL.md
cards:
  - front: What is the first thing to build before you try to improve a search system?
    back: A judged test set. Write down a set of real queries and decide which results are relevant for each one. Without it, you cannot tell if a change made search better or worse.
  - front: What is offline evaluation, and why is it so useful?
    back: You score the search against judged queries before users see the change. It is fast and repeatable, so you (or an AI agent) can try many ideas and keep only the ones that measurably help.
  - front: How do you judge an ambiguous query such as "golf"?
    back: Write down the intent and the persona behind it. A car buyer and a sports fan need different results. Without context, there is no single correct answer to judge against.
  - front: Why is the weight of "Exact" versus "Partial" a product decision?
    back: The weights say how much more useful a perfect match is to your users than a close one. Choose them for your domain. The metric follows that choice.
  - front: Why must the test set include good results that the ranker never returns?
    back: If you judge only what the ranker shows, a system that returns one good result and misses all others looks perfect. The ideal ranking must contain everything relevant.
  - front: What does NDCG reward that a simple "count of good results" does not?
    back: Order. A good result at the top counts more than the same result further down, and the score compares your ranking with the best possible ranking for that query.
  - front: "Exercise: two rankings contain the same ten products, in a different order. Which metric can tell them apart: NDCG@10 or Recall@50?"
    back: NDCG@10. Recall only asks which relevant products were found, not where they are. NDCG gives more credit when the good products are near the top.
  - front: Why can a higher average score still be a bad change?
    back: The average can hide queries that got much worse. Look at the queries that lost, find what they have in common, and fix or limit the change for them.
  - front: Which questions do MRR and Recall@50 answer?
    back: "MRR: how high is the first good result? Recall@50: how many of the good results did we find at all? They can move in opposite directions, so look at both."
  - front: What must you check next to relevance before you ship a ranking change?
    back: Response time (the slow requests, such as p95, not only the median) and cost. A more relevant search that is too slow or too expensive still fails users and the business.
  - front: How do you decide what to improve next in your search?
    back: Look at the weakest queries and find why they fail. Let those failures choose the next technique, not a fixed list of methods.
